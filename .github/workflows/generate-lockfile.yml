name: Generate ClarithmIA package lock

on:
  push:
    branches:
      - fix/security-multitenancy

permissions:
  contents: write

jobs:
  generate:
    name: Generate and validate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/security-multitenancy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate generated lockfile
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
          else
            git commit -m "Add generated package lock"
            git push origin HEAD:fix/security-multitenancy
          fi

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: clarithmia-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
