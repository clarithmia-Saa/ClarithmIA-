
name: ClarithmIA CI validation

on:
  push:
    branches:
      - fix/security-multitenancy
  pull_request:
    branches:
      - fix/security-multitenancy

permissions:
  contents: read

jobs:
  validation:
    name: Validate Node build and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check package lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck Netlify API
        run: npm run typecheck:api

      - name: Run API tests
        run: npm run test:api

      - name: Build application
        run: npm run build
        
